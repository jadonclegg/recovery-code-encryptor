# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  tag-version:
    desc: tag docker image with specific version
    requires:
      vars: 
        - VERSION
    cmds:
      - podman tag ghcr.io/jadonclegg/recovery-code-encryptor:latest ghcr.io/jadonclegg/recovery-code-encryptor:{{.VERSION}}
      - podman push ghcr.io/jadonclegg/recovery-code-encryptor:{{.VERSION}}
      - podman push ghcr.io/jadonclegg/recovery-code-encryptor:latest
      - git tag {{.VERSION}}
      - git push --tags

  frontend-watch:
    desc: build / watch frontend in dev mode
    dir: ./web2
    cmds:
      - ng build --watch -c development

  run-fs:
    desc: run app using frontend from fs
    deps:
      - docker
    cmds:
      - podman run -it --rm --name recovery-code-encryptor-test -p 8080:8080 -v ./web2/dist:/app/dist recovery-code-encryptor:latest /app/recovery-code-encryptor --fs

  run:
    desc: run app
    deps:
      - docker
    cmds:
      - podman run -it --rm --name recovery-code-encryptor-test -p 8080:8080 recovery-code-encryptor:latest

  docker:
    desc: build docker image
    deps:
      - build
    cmds:
      - podman build -f DockerFile --tag recovery-code-encryptor
      - podman tag localhost/recovery-code-encryptor:latest ghcr.io/jadonclegg/recovery-code-encryptor:latest

  build:
    desc: build app
    cmds:
      - task: build-frontend
      - task: build-backend

  build-backend:
    sources: 
      - "**/*.go"
      - "go.mod"
      - "web2/dist/**/*"
    generates:
      - recovery-code-encryptor
    cmds:
      - CGO_ENABLED=0 GOOS=linux go build
  
  build-frontend:
    dir: ./web2
    sources:
      - "src/"
      - "public/"
      - "*.json"
    generates:
      - "dist/**/*"
    cmds:
      - ng build