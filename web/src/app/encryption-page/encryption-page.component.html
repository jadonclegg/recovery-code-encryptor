<form [formGroup]="form" class="inputs">
  <div>
    <label>Password:</label>
    <input type="password" formControlName="password1" />
  </div>
  <div>
    <label>Confirm:</label>
    <input type="password" formControlName="password2" />
  </div>
  <div *ngIf="form.touched || failedSubmit">
    <div *ngIf="form.get('password1')?.errors?.['required']" class="error">
      Must provide a password.
    </div>
    <div *ngIf="form.errors?.['passwordsDoNotMatch']" class="error">
      Passwords don't match!
    </div>
    <div *ngIf="form.get('password1')?.errors?.['minlength']" class="error">
      Password must be at least 8 characters long!
    </div>
  </div>

  <div>
    <label>Credential Name:</label>
    <input type="text" formControlName="name" />
  </div>
  <div *ngIf="failedSubmit">
    <div *ngIf="form.get('name')?.errors?.['required']" class="error">
      Must provide a credential name
    </div>
  </div>

  <div>
    <label>Data:</label>
    <textarea formControlName="data"></textarea>
  </div>
  <div *ngIf="failedSubmit">
    <div *ngIf="form.get('data')?.errors?.['required']" class="error">
      Must provide data to encrypt/decrypt
    </div>
  </div>
  <div>
    <button type="button" (click)="encrypt()">Encrypt</button>
    <button type="button" (click)="decrypt()">Decrypt</button>
  </div>

  <div>
    <label>Output:</label>
    <textarea formControlName="output"></textarea>
  </div>
</form>
